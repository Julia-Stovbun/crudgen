[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crudgen"
version = "0.1.0"
description = "CLI for generating a small FastAPI CRUD project from YAML or JSON"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
crudgen = "crudgen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crudgen.core" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
